name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: |
          python tools/make_icon.py
          pyinstaller --noconfirm --clean --onefile --windowed --name Import2Flex --icon build/icon.ico Import2Flex.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: Import2Flex-windows
          path: dist/Import2Flex.exe
